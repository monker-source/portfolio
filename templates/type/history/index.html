<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SASHA — Project · How it was done</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../other/tokens.css?v=12">
<style>
  * { box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    background: var(--bg);
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ui);
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  a:hover { color: var(--muted); }

  body > .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 40;
    padding: var(--header-pad-top) var(--pad) var(--header-pad-bottom);
    background: transparent !important;
    background-color: transparent !important;
    color: var(--ink);
  }

  .site-nav {
    display: grid;
    grid-template-columns: var(--cols) auto;
    gap: var(--col-gap);
    align-items: baseline;
    font-weight: 600;
  }

  .project-page {
    padding: var(--space-32) var(--pad) var(--gap-page);
  }

  .grid {
    display: grid;
    grid-template-columns: var(--cols);
    gap: var(--col-gap);
    align-items: start;
  }

  .story-head {
    margin: 0 0 var(--space-40);
  }

  .story-head h1 {
    margin: 0 0 8px;
    font-size: clamp(28px, 4vw, 40px);
    line-height: var(--lead-heading);
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .story-back {
    font-size: var(--text-sm);
    font-weight: 600;
    color: var(--muted);
  }

  .story-back:hover {
    color: var(--ink);
  }

  .story {
    display: flex;
    flex-direction: column;
    gap: var(--gap-block);
    margin: 0 0 var(--space-56);
  }

  .story p {
    margin: 0 auto;
    max-width: 36em;
    font-size: var(--text-md);
    line-height: var(--lead-body);
    font-weight: 600;
  }

  .story-figure {
    margin: 0 auto calc(var(--gap-after-media) - var(--gap-block));
    width: min(68%, 880px);
  }

  .story-figure--wide,
  .story-figure--pair {
    width: 100%;
  }

  .story-figure--pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--col-gap);
    align-items: start;
  }

  .story-figure img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 42.5vh;
    object-fit: contain;
    object-position: center top;
    background: var(--card);
    border-radius: var(--radius);
  }

  .story-figure--wide img,
  .story-figure--pair img {
    max-height: none;
  }

  .story-figure figcaption {
    margin: var(--space-10) 0 0;
    color: var(--muted);
    font-size: var(--text-xs);
    line-height: var(--lead-ui);
    font-weight: 600;
    text-align: center;
  }

  .story-figure--pair figcaption {
    grid-column: 1 / -1;
  }

  .contact {
    padding: var(--footer-pad-top) var(--pad) var(--footer-pad-bottom);
    background: var(--bg);
  }

  .contact-top {
    display: grid;
    grid-template-columns: var(--cols);
    gap: var(--col-gap);
    align-items: start;
  }

  .contact-headline {
    margin: 0;
    font-size: var(--ui-size);
    font-weight: 600;
    line-height: var(--ui-lead);
  }

  .contact-links {
    grid-column: 3;
    display: flex;
    flex-direction: column;
    gap: var(--gap-stack);
    font-weight: 600;
  }

  .contact-clock {
    justify-self: end;
    font-weight: 600;
    white-space: nowrap;
  }

  @media (max-width: 800px) {
    .grid,
    .contact-top {
      grid-template-columns: 1fr;
      row-gap: var(--gap-media);
    }

    .story-figure--pair {
      grid-template-columns: 1fr;
    }

    .contact-links {
      grid-column: 1;
    }

    .contact-clock {
      justify-self: start;
    }
  }
</style>
</head>
<body>

  <main class="project-page">
    <header class="story-head">
      <p><a class="story-back" href="../">← Project</a></p>
      <h1>How it was done</h1>
    </header>
    <article class="story" id="story" aria-label="Story"></article>
  </main>

  <script src="../../../other/site.js?v=12"></script>
  <script src="../../../other/story-md.js"></script>
  <script>
    StoryMd.load(document.getElementById("story"), "story.md");
  </script>
  <script src="../../../other/draw.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SASHA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="other/tokens.css?v=live-24">
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
  }

  .gate {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    box-sizing: border-box;
    min-height: 100%;
    padding: var(--pad);
    color: inherit;
    text-align: center;
    text-decoration: none;
  }

  .gate:hover {
    color: var(--muted);
  }

  .gate-title,
  .gate-note {
    margin: 0;
  }

  .gate-title {
    width: 100%;
    font-family: var(--display);
    font-weight: 400;
    font-size: calc((100vw - 2 * var(--pad)) / 7.25);
    letter-spacing: -0.05em;
    line-height: 1;
  }

  .gate-note {
    width: 100%;
    box-sizing: border-box;
    font-family: var(--ui);
    font-weight: 600;
    font-size: clamp(16px, 2vw, 22px);
    line-height: 1;
    letter-spacing: normal;
    white-space: nowrap;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
</style>
</head>
<body>
  <a class="gate" href="home.html">
    <p class="gate-title">SITE UNDER</p>
    <p class="gate-note"><span>come</span><span>back</span><span>later</span></p>
    <p class="gate-title">CONSTRUCTION</p>
  </a>
  <script>
    (function () {
      function ink(el) {
        var host = el.querySelector("span:last-child") || el;
        var sample = el.classList.contains("gate-note") ? "later" : el.textContent;
        var range = document.createRange();
        range.selectNodeContents(host);
        var rect = range.getBoundingClientRect();
        var canvas = document.createElement("canvas").getContext("2d");
        canvas.font = getComputedStyle(el).font;
        var measured = canvas.measureText(sample);
        var fontHeight = measured.fontBoundingBoxAscent + measured.fontBoundingBoxDescent;
        var scale = fontHeight ? rect.height / fontHeight : 1;
        return {
          top: rect.top + (measured.fontBoundingBoxAscent - measured.actualBoundingBoxAscent) * scale,
          bottom: rect.bottom - (measured.fontBoundingBoxDescent - measured.actualBoundingBoxDescent) * scale
        };
      }

      function stack() {
        var lines = Array.prototype.slice.call(document.querySelectorAll(".gate-title, .gate-note"));
        lines.forEach(function (el) { el.style.marginTop = "0px"; });
        for (var i = 1; i < lines.length; i++) {
          var gap = ink(lines[i]).top - ink(lines[i - 1]).bottom;
          lines[i].style.marginTop = (1 - gap) + "px";
        }
      }

      function layout() {
        stack();
      }

      if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
      layout();
      window.addEventListener("resize", layout);
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SASHA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="other/tokens.css?v=live-20">
<style>
  @font-face {
    font-family: "Imperial";
    src: url("fonts/imperialBetaV01-Regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --desc-max: 640px;
  }

  * { box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    background: var(--bg);
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ui);
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  a:hover { color: var(--muted); }

  a.project,
  a.project:hover {
    color: var(--card-ink);
  }

  .is-active { color: inherit; }

  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 40;
    padding: var(--header-pad-top) var(--pad) var(--header-pad-bottom);
    background: transparent !important;
    background-color: transparent !important;
    color: var(--ink);
  }

  body[data-nav-reveal] .site-header {
    position: fixed;
    left: 0;
    right: 0;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-6px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  body[data-nav-reveal] .site-header.is-visible {
    opacity: 1;
    pointer-events: auto;
    transform: none;
  }

  .site-nav {
    display: grid;
    grid-template-columns: var(--cols) auto;
    gap: var(--col-gap);
    align-items: baseline;
    font-weight: 600;
  }

  .site-nav a {
    color: var(--ink);
  }

  .site-nav a:hover {
    color: var(--muted);
  }

  .theme-swatches {
    display: flex;
    align-items: center;
    justify-self: end;
    align-self: center;
    gap: var(--gap-stack);
    margin: 0;
    padding: 0;
  }

  .theme-swatch {
    width: 10px;
    height: 10px;
    margin: 5px;
    padding: 0;
    border-radius: 100%;
    border: 1px solid var(--ink);
    background: var(--swatch);
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
  }

  .theme-swatch[aria-pressed="true"] {
    outline: 1px solid var(--ink);
    outline-offset: 2px;
  }

  .brand {
    font-family: var(--ui);
    font-size: var(--ui-size);
    font-weight: 600;
    line-height: var(--ui-lead);
  }

  /* —— Intro (name + bio) —— */
  .intro {
    padding: var(--pad) var(--pad) var(--space-64);
    display: grid;
    grid-template-columns: var(--cols);
    gap: var(--col-gap);
  }

  .intro-copy {
    grid-column: 1 / -1;
    margin: 0;
    max-width: none;
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
    color: var(--muted);
  }

  .intro-name {
    color: var(--ink);
  }

  /* —— Scattered projects —— */
  .works {
    padding: var(--gap-section) var(--pad) var(--gap-page);
    overflow: hidden;
  }

  .projects {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 0;
    width: 100%;
    margin: 0 auto;
    min-height: 40vh;
  }

  .project {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: var(--gap-card);
    z-index: 1;
    padding: calc(var(--ui-size) * 2);
    background: var(--card);
    color: var(--card-ink);
    border-radius: var(--radius);
    container-type: inline-size;
  }

  .project:hover {
    z-index: 5;
  }

  .project-back {
    position: absolute;
    left: 0;
    z-index: 0;
    width: 100%;
    height: auto;
    pointer-events: none;
    transform: translateY(-50%);
    opacity: 0;
    color: var(--ink);
    line-height: 0;
  }

  .project-back svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }

  .project-back path {
    stroke: currentColor;
    fill: none;
    stroke-dasharray: var(--len, 0);
    stroke-dashoffset: var(--len, 0);
  }

  .project-back.is-drawn path {
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 0.45s ease;
    transition-delay: calc(var(--i, 0) * 1s);
  }

  .projects.is-backed .project-back {
    opacity: 1;
  }

  .project-media {
    display: block;
    line-height: 0;
    width: 100%;
    aspect-ratio: var(--ratio, auto);
  }

  .project-media img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .project-media:has(.project-fallback) {
    line-height: normal;
  }

  .project-fallback {
    margin: 0;
    width: max-content;
    font-family: var(--display);
    color: var(--card-ink);
    font-size: 18cqw;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 0.9;
    white-space: nowrap;
  }

  .project-meta {
    display: grid;
    grid-template-columns: minmax(0, var(--desc-max)) 1fr max-content;
    column-gap: var(--col-gap);
    align-items: start;
    justify-content: space-between;
  }

  .project-title {
    display: none;
    margin: 0;
    color: var(--card-ink);
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
  }

  .project-description {
    grid-column: 1;
    grid-row: 1;
    margin: 0;
    max-width: var(--desc-max);
    color: var(--card-ink);
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
  }

  .project-kind {
    grid-column: 3;
    grid-row: 1;
    margin: 0;
    justify-self: end;
    color: var(--card-muted);
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
    white-space: nowrap;
  }

  /* Scatter positions — larger, pushed to the edges */
  .project[data-place="0"] {
    width: min(64%, 780px);
    align-self: flex-start;
    margin-left: 0;
    margin-bottom: -4vh;
  }

  .project[data-place="1"] {
    width: min(50%, 600px);
    align-self: flex-end;
    margin-right: 0;
    margin-top: 8vh;
    margin-bottom: -6vh;
  }

  .project[data-place="2"] {
    width: min(58%, 700px);
    align-self: flex-start;
    margin-left: 8%;
    margin-top: 10vh;
    margin-bottom: -3vh;
  }

  .project[data-place="3"] {
    width: min(54%, 640px);
    align-self: flex-end;
    margin-right: 6%;
    margin-top: 6vh;
    margin-bottom: -5vh;
  }

  .project[data-place="4"] {
    width: min(52%, 620px);
    align-self: flex-start;
    margin-left: 4%;
    margin-top: 8vh;
    margin-bottom: -4vh;
  }

  .project[data-place="5"] {
    width: min(62%, 740px);
    align-self: flex-end;
    margin-right: 0;
    margin-top: 10vh;
  }

  .contact {
    padding: var(--footer-pad-top) var(--pad) var(--footer-pad-bottom);
    background: var(--bg);
  }

  .contact-top {
    display: grid;
    grid-template-columns: var(--cols);
    gap: var(--col-gap);
    align-items: start;
  }

  .contact-headline {
    margin: 0;
    font-size: var(--ui-size);
    font-weight: 600;
    line-height: var(--ui-lead);
  }

  .contact-links {
    grid-column: 3;
    display: flex;
    flex-direction: column;
    gap: var(--gap-stack);
    font-weight: 600;
  }

  .contact-clock {
    justify-self: end;
    font-weight: 600;
    white-space: nowrap;
  }

  @media (max-width: 800px) {
    .contact-top {
      grid-template-columns: 1fr;
      row-gap: var(--gap-media);
    }

    .theme-swatches {
      justify-self: start;
    }

    .contact-links {
      grid-column: 1;
    }

    .contact-clock {
      justify-self: start;
    }

    .works {
      padding-left: var(--pad);
      padding-right: var(--pad);
    }

    .project[data-place] {
      width: 100%;
      align-self: stretch;
      margin: 0 0 var(--gap-section);
    }

    .project-meta {
      grid-template-columns: 1fr;
    }

    .project-title,
    .project-description,
    .project-kind {
      grid-column: 1;
      grid-row: auto;
    }
  }
</style>
</head>
<body data-nav-reveal>

  <section class="intro" aria-label="About">
    <p class="intro-copy"></p>
  </section>

  <section class="works" id="index" aria-label="Works">
    <div class="projects" id="projects"></div>
  </section>

  <script src="other/site.js?v=16"></script>
  <script src="other/project-md.js?v=6"></script>
  <script>
    ProjectMd.mount(document.querySelector(".intro"), "Intro.md");
  </script>
  <script>
    (function () {
      const list = document.getElementById("projects");

      function renderProject(project, index) {
        const href = project.href || null;
        const el = document.createElement(href ? "a" : "article");
        el.className = "project";
        el.dataset.place = String(index % 6);
        if (href) el.href = href;
        if (project.illustration) el.dataset.illustration = project.illustration;

        const media = document.createElement("div");
        media.className = "project-media";

        if (project.width && project.height) {
          media.style.setProperty(
            "--ratio",
            project.width + " / " + project.height
          );
        }

        if (project.preview) {
          const img = document.createElement("img");
          img.src = project.preview + "?v=" + (project.width || 0) + "x" + (project.height || 0);
          img.alt = project.title;
          img.loading = "lazy";
          if (project.width && project.height) {
            img.width = project.width;
            img.height = project.height;
          }
          media.appendChild(img);
        } else {
          const fallback = document.createElement("p");
          fallback.className = "project-fallback";
          fallback.textContent = project.title;
          media.appendChild(fallback);
        }

        const meta = document.createElement("div");
        meta.className = "project-meta";

        const title = document.createElement("h2");
        title.className = "project-title";
        title.textContent = project.title;

        const description = document.createElement("p");
        description.className = "project-description";
        description.textContent =
          project.description || "Placeholder description for this project.";

        const kind = document.createElement("p");
        kind.className = "project-kind";
        kind.textContent = project.kind || "";

        meta.appendChild(title);
        meta.appendChild(description);
        meta.appendChild(kind);

        el.appendChild(media);
        el.appendChild(meta);
        return el;
      }

      window.loadProjects().then(ProjectMd.hydrate).then(function (projects) {
        if (!list) return;

        const back = document.createElement("div");
        back.className = "project-back";
        back.setAttribute("aria-hidden", "true");
        list.appendChild(back);

        const illustrations = Object.create(null);
        let hovering = false;
        let activeSrc = "";

        function loadIllustration(src) {
          if (illustrations[src]) return illustrations[src];
          illustrations[src] = fetch(src)
            .then(function (res) {
              if (!res.ok) throw new Error("Could not load illustration");
              return res.text();
            })
            .then(function (text) {
              const parsed = new DOMParser().parseFromString(text, "image/svg+xml");
              const svg = parsed.querySelector("svg");
              if (!svg) throw new Error("Illustration has no svg");
              const node = document.importNode(svg, true);
              back.appendChild(node);
              const measured = Array.from(node.querySelectorAll("path")).map(function (path) {
                const box = path.getBBox();
                return {
                  path: path,
                  len: path.getTotalLength(),
                  x: box.x + box.width / 2,
                };
              });
              node.remove();
              measured.sort(function (a, b) { return a.x - b.x; });
              const minX = measured.length ? measured[0].x : 0;
              const maxX = measured.length ? measured[measured.length - 1].x : 0;
              const span = Math.max(maxX - minX, 1);
              measured.forEach(function (item) {
                item.path.style.setProperty("--len", item.len + "px");
                item.path.style.setProperty("--i", String((item.x - minX) / span));
              });
              return node;
            });
          return illustrations[src];
        }

        function placeBack(project) {
          hovering = true;
          const src = project.dataset.illustration;
          activeSrc = src;
          back.style.top = (project.offsetTop + project.offsetHeight / 2) + "px";
          loadIllustration(src).then(function (svg) {
            if (!hovering || activeSrc !== src) return;
            if (svg.parentNode !== back) back.replaceChildren(svg);
            back.classList.remove("is-drawn");
            void back.offsetWidth;
            list.classList.add("is-backed");
            requestAnimationFrame(function () {
              if (!hovering || activeSrc !== src) return;
              back.classList.add("is-drawn");
            });
          });
        }

        function clearBack() {
          hovering = false;
          list.classList.remove("is-backed");
          back.classList.remove("is-drawn");
        }

        projects.forEach(function (project, index) {
          const card = renderProject(project, index);
          if (card.dataset.illustration) {
            card.addEventListener("mouseenter", function () {
              placeBack(card);
            });
            card.addEventListener("mouseleave", clearBack);
            card.addEventListener("focus", function () {
              placeBack(card);
            });
            card.addEventListener("blur", clearBack);
          }
          list.appendChild(card);
        });

        function fitFallbacks() {
          list.querySelectorAll(".project-fallback").forEach(function (el) {
            const parent = el.parentElement;
            const parentW = parent.clientWidth;
            if (!parentW) return;
            el.style.width = "max-content";
            el.style.fontSize = "100px";
            const textW = el.getBoundingClientRect().width;
            if (!textW) return;
            el.style.fontSize = (100 * parentW) / textW + "px";
          });
        }

        function scheduleFit() {
          requestAnimationFrame(function () {
            fitFallbacks();
            requestAnimationFrame(fitFallbacks);
          });
        }

        scheduleFit();
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(scheduleFit);
        }
        window.addEventListener("resize", scheduleFit);
      });
    })();
  </script>

  <script src="other/draw.js"></script>
</body>
</html>

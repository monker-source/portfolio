<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SASHA — Tangley · How it was done</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f2f0;
    --ink: #111111;
    --muted: #7a7a7a;
    --pad: clamp(16px, 2.2vw, 28px);
    --ui: "Golos Text", sans-serif;
    --ui-size: 16px;
    --ui-lead: 1.35;
    --cols: 1.4fr 1fr 1fr 1.2fr;
    --col-gap: 28px;
    --card: #fff;
  }

  * { box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    background: var(--bg);
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ui);
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  a:hover { color: var(--muted); }

  body > .site-header {
    position: sticky;
    top: 0;
    left: 0;
    right: 0;
    z-index: 40;
    padding: 18px var(--pad) 14px;
    background: transparent;
    color: var(--ink);
  }

  .site-nav {
    display: grid;
    grid-template-columns: var(--cols) auto;
    gap: var(--col-gap);
    align-items: baseline;
    font-weight: 600;
  }

  .project-page {
    padding: 32px var(--pad) 80px;
  }

  .grid {
    display: grid;
    grid-template-columns: var(--cols);
    gap: var(--col-gap);
    align-items: start;
  }

  .story-head {
    margin: 0 0 40px;
  }

  .story-head h1 {
    margin: 0 0 8px;
    font-size: clamp(28px, 4vw, 40px);
    line-height: 1.1;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .story-back {
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
  }

  .story-back:hover {
    color: var(--ink);
  }

  .story {
    display: flex;
    flex-direction: column;
    gap: 28px;
    margin: 0 0 56px;
  }

  .story p {
    margin: 0 auto;
    max-width: 36em;
    font-size: 16px;
    line-height: 1.5;
    font-weight: 600;
  }

  .story-figure {
    margin: 0 auto;
    width: min(68%, 880px);
  }

  .story-figure--wide,
  .story-figure--pair {
    width: 100%;
  }

  .story-figure--pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--col-gap);
    align-items: start;
  }

  .story-figure img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 42.5vh;
    object-fit: contain;
    object-position: center top;
    background: var(--card);
    border-radius: 8px;
  }

  .story-figure--wide img,
  .story-figure--pair img {
    max-height: none;
  }

  .story-figure figcaption {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.35;
    font-weight: 600;
    text-align: center;
  }

  .story-figure--pair figcaption {
    grid-column: 1 / -1;
  }

  .contact {
    padding: 14px var(--pad) 18px;
    background: var(--bg);
  }

  .contact-top {
    display: grid;
    grid-template-columns: var(--cols);
    gap: var(--col-gap);
    align-items: start;
  }

  .contact-headline {
    margin: 0;
    font-size: var(--ui-size);
    font-weight: 600;
    line-height: var(--ui-lead);
  }

  .contact-links {
    grid-column: 3;
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-weight: 600;
  }

  .contact-clock {
    justify-self: end;
    font-weight: 600;
    white-space: nowrap;
  }

  @media (max-width: 800px) {
    .grid,
    .contact-top {
      grid-template-columns: 1fr;
      row-gap: 12px;
    }

    .story-figure--pair {
      grid-template-columns: 1fr;
    }

    .contact-links {
      grid-column: 1;
    }

    .contact-clock {
      justify-self: start;
    }
  }
</style>
</head>
<body>

  <main class="project-page">
    <header class="story-head">
      <p><a class="story-back" href="../">← Tangley</a></p>
      <h1>How it was done</h1>
    </header>
    <article class="story" id="story" aria-label="Story"></article>
  </main>

  <script src="../../../site.js"></script>
  <script src="../../../story-md.js"></script>
  <script>
    StoryMd.load(document.getElementById("story"), "story.md");
  </script>
  <script src="../../../draw.js"></script>
</body>
</html>

<!-- Template: templates/type/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SASHA — Tangley</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../../other/tokens.css?v=live-24">
<style>
  @font-face {
    font-family: "Tangley Trial";
    src: url("source/TangleyTrial-Regular.otf") format("opentype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  * { box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    background: var(--bg);
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ui);
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  a:hover { color: var(--muted); }

  body > .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 40;
    padding: var(--header-pad-top) var(--pad) var(--header-pad-bottom);
    background: transparent !important;
    background-color: transparent !important;
    color: var(--ink);
  }

  .site-nav {
    display: grid;
    grid-template-columns: var(--cols) auto;
    gap: var(--col-gap);
    align-items: baseline;
    font-weight: 600;
  }

  .site-nav a {
    color: var(--ink);
  }

  .site-nav a:hover {
    color: var(--muted);
  }

  .brand {
    font-family: var(--ui);
    font-size: var(--ui-size);
    font-weight: 600;
    line-height: var(--ui-lead);
  }

  .project-page {
    padding: var(--gap-section) var(--pad) var(--gap-page);
  }

  .grid {
    display: grid;
    grid-template-columns: var(--cols);
    gap: var(--col-gap);
    align-items: start;
  }

  .grid p,
  .grid h1,
  .grid h2 {
    margin: 0;
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
  }

  .intro-menu {
    align-items: center;
  }

  .intro-menu h1 {
    font-family: var(--ui);
    font-size: var(--text-lg);
    line-height: var(--lead-copy);
    font-weight: 600;
    text-transform: uppercase;
  }

  .intro-menu .btn-accent {
    grid-column: 4;
    justify-self: start;
  }

  .project-kind[hidden] {
    display: none;
  }

  .hero {
    position: relative;
    margin: 0;
    padding: 0;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: var(--ink);
    color: var(--card-ink);
  }

  .hero iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .intro {
    margin: 0 0 var(--gap-page);
  }

  .btn-accent:empty {
    display: none;
  }

  .btn-accent {
    display: inline-block;
    padding: var(--space-6) var(--space-14);
    border: 0;
    border-radius: var(--radius);
    background: var(--ink);
    color: var(--bg);
    font: inherit;
    font-weight: 600;
    line-height: var(--lead-tight);
    cursor: pointer;
  }

  a.btn-accent:hover {
    color: var(--bg);
    opacity: 0.82;
  }

  .intro-copy {
    margin-top: var(--gap-block);
  }

  .intro-copy p {
    grid-column: 1 / -1;
    max-width: none;
    font-size: var(--text-lg);
    line-height: var(--lead-copy);
    font-weight: 600;
  }

  .intro-more {
    margin-top: var(--space-20);
  }

  .intro-more a {
    font-size: var(--text-md);
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .slideshow {
    --slideshow-slide-w: 720px;
    margin: var(--gap-block) 0 var(--gap-section);
    width: 100vw;
    margin-left: calc(50% - 50vw);
    overflow: visible;
  }

  .slideshow[hidden] {
    display: none;
  }

  .slideshow-scroller {
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    cursor: grab;
    outline: none;
    scroll-snap-type: none;
  }

  .slideshow-scroller::-webkit-scrollbar {
    display: none;
  }

  .slideshow-scroller.is-dragging {
    cursor: grabbing;
    scroll-behavior: auto;
  }

  .slideshow-track {
    display: flex;
    gap: var(--gap-media);
    width: max-content;
    padding-inline: var(--pad);
  }

  .slideshow-set {
    display: flex;
    gap: var(--gap-media);
    flex: 0 0 auto;
  }

  .slideshow-slide {
    position: relative;
    flex: 0 0 var(--slideshow-slide-w);
    width: var(--slideshow-slide-w);
    margin: 0;
    overflow: hidden;
    border-radius: var(--radius);
    background: var(--card);
  }

  .slideshow-slide img {
    display: block;
    width: 100%;
    height: auto;
    pointer-events: none;
    user-select: none;
  }

  .tester-section {
    margin: 0 0 0;
    overflow: visible;
    width: 100%;
  }

  .type-tester {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    overflow: visible;
  }

  .type-tester-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: var(--space-20) var(--gap-col);
    margin: var(--gap-block) 0 0;
    font-size: var(--text-xs);
    line-height: var(--lead-ui);
    font-weight: 600;
    color: var(--muted);
  }

  .type-tester-control {
    display: flex;
    align-items: center;
    gap: var(--gap-media);
  }

  .type-tester-control-label {
    display: inline-flex;
    align-items: baseline;
    gap: var(--space-4);
    white-space: nowrap;
  }

  .type-tester-range {
    width: min(180px, 36vw);
    accent-color: var(--ink);
    cursor: pointer;
  }

  .type-tester-field {
    display: block;
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 0.45em 0.08em;
    border: 0;
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font-weight: 400;
    letter-spacing: normal;
    text-align: center;
    resize: none;
    overflow: visible;
    outline: none;
    field-sizing: content;
  }

  .type-tester-field::placeholder {
    color: var(--muted);
  }

  .tester-note {
    margin: var(--space-20) auto var(--space-56);
    max-width: 36em;
    text-align: center;
    font-size: var(--text-xs);
    line-height: var(--lead-caption);
    font-weight: 600;
    color: var(--muted);
  }

  .tester-note a {
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .specimen-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--col-gap);
    margin: 0;
  }

  .specimen-grid figure {
    margin: 0;
    overflow: hidden;
    border-radius: var(--radius);
    background: var(--card);
  }

  .specimen-grid .specimen-wide {
    grid-column: 1 / -1;
  }

  .specimen-grid img {
    display: block;
    width: 100%;
    height: auto;
  }

  .contact {
    padding: var(--footer-pad-top) var(--pad) var(--footer-pad-bottom);
    background: var(--bg);
  }

  .contact-top {
    display: grid;
    grid-template-columns: var(--cols);
    gap: var(--col-gap);
    align-items: start;
  }

  .contact-headline {
    margin: 0;
    font-size: var(--ui-size);
    font-weight: 600;
    line-height: var(--ui-lead);
  }

  .contact-links {
    grid-column: 3;
    display: flex;
    flex-direction: column;
    gap: var(--gap-stack);
    font-weight: 600;
  }

  .contact-clock {
    justify-self: end;
    font-weight: 600;
    white-space: nowrap;
  }

  @media (max-width: 800px) {
    .grid,
    .contact-top {
      grid-template-columns: 1fr;
      row-gap: var(--gap-media);
    }

    .intro-copy p,
    .intro-more,
    .intro-menu .btn-accent,
    .contact-links {
      grid-column: 1;
    }

    .specimen-grid {
      grid-template-columns: 1fr;
    }

    .contact-clock {
      justify-self: start;
    }
  }
</style>
</head>
<body>

  <section class="hero" aria-label="Tangley">
    <iframe
      src="https://player.vimeo.com/video/778934108?background=1&autoplay=1&loop=1&muted=1&autopause=0"
      title="Tangley"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen></iframe>
  </section>

  <main class="project-page">
    <section class="intro" data-project aria-label="Project">
      <div class="grid intro-menu">
        <h1></h1>
        <p class="project-kind" hidden></p>
        <a
          class="btn-accent"
          href=""
          target="_blank"
          rel="noopener noreferrer"></a>
      </div>
      <div class="grid intro-copy"></div>
      <div class="grid intro-more">
        <a href="history/">How it was done</a>
      </div>
    </section>

    <!-- Slideshow hidden for now

      <figure><img src="slideshow/tangley-site-9.png" alt="Tangley specimen"></figure>

  </main>

  <script src="../../other/site.js?v=20"></script>

</body>
</html>

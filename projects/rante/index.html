<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SASHA — Rante</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../other/tokens.css?v=live-13">
<style>
  * { box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    background: var(--bg);
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ui);
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  a:hover { color: var(--muted); }

  body > .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 40;
    padding: var(--header-pad-top) var(--pad) var(--header-pad-bottom);
    background: transparent !important;
    background-color: transparent !important;
    color: var(--ink);
  }

  .site-nav {
    display: grid;
    grid-template-columns: var(--cols) auto;
    gap: var(--col-gap);
    align-items: baseline;
    font-weight: 600;
  }

  .site-nav a { color: var(--ink); }
  .site-nav a:hover { color: var(--muted); }

  .brand {
    font-family: var(--ui);
    font-size: var(--ui-size);
    font-weight: 600;
    line-height: var(--ui-lead);
  }

  .hero {
    display: flex;
    align-items: flex-end;
    margin: 0;
    padding: 0 var(--pad) var(--gap-page);
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--bg);
  }

  .hero img {
    display: block;
    width: 100%;
    height: auto;
  }

  .project-page {
    padding: 0 var(--pad) var(--gap-page);
  }

  .grid {
    display: grid;
    grid-template-columns: var(--cols);
    gap: var(--col-gap);
    align-items: start;
  }

  .grid p,
  .grid h1 {
    margin: 0;
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
  }

  .intro {
    margin: 0 0 var(--gap-page);
  }

  .intro-menu {
    grid-template-columns: 1fr 1fr;
    align-items: start;
  }

  .intro-menu h1 {
    grid-column: 2 / -1;
    grid-row: 1;
    font-family: var(--ui);
    font-size: var(--text-xl);
    line-height: var(--lead-tight);
    font-weight: 600;
    letter-spacing: -0.03em;
  }

  .intro-meta {
    grid-column: 1;
    grid-row: 1 / span 2;
    justify-self: start;
    align-self: start;
    margin: 0;
    padding: 0;
    list-style: none;
    text-align: left;
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
  }

  .intro-meta li {
    display: block;
  }

  .intro-meta li + li {
    margin-top: 0.35em;
  }

  .intro-meta .label {
    margin-right: 0.55em;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .intro-copy {
    grid-column: 2 / -1;
    grid-row: 2;
    display: flex;
    flex-direction: column;
    gap: var(--gap-text);
    margin-top: var(--gap-block);
  }

  .intro-copy p {
    margin: 0;
    max-width: none !important;
    font-size: var(--text-lg);
    line-height: var(--lead-copy);
    font-weight: 600;
  }

  .slideshow[hidden] {
    display: none;
  }

  .story {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: var(--col-gap);
    row-gap: var(--gap-block);
    margin: 0 0 var(--gap-section);
  }

  .story p,
  .story-figure {
    grid-column: 2 / -1;
    margin: 0;
    max-width: none !important;
  }

  .story p {
    font-size: var(--text-md);
    line-height: var(--lead-body);
    font-weight: 600;
  }

  .story p + p {
    margin-top: 0;
  }

  .story p.story-kicker {
    font-size: var(--text-xs);
    line-height: var(--lead-ui);
    color: var(--muted);
    text-align: left;
  }

  .story em {
    font-style: italic;
    font-weight: 400;
  }

  .story-figure {
    margin-bottom: calc(var(--gap-after-media) - var(--gap-block));
  }

  .story-figure--wide,
  .story-figure--pair,
  .story-figure--grid {
    grid-column: 1 / -1;
    width: 100%;
  }

  .story-figure--pair,
  .story-figure--grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--col-gap);
    align-items: start;
  }

  .story-figure img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 42.5vh;
    object-fit: contain;
    object-position: center top;
    background: transparent;
    border-radius: var(--radius);
  }

  .story-figure--wide img,
  .story-figure--pair img,
  .story-figure--grid img {
    max-height: none;
  }

  .story-figure figcaption {
    margin: var(--space-10) 0 0;
    color: var(--muted);
    font-size: var(--text-xs);
    line-height: var(--lead-ui);
    font-weight: 600;
    text-align: left;
  }

  .story-figure--pair figcaption,
  .story-figure--grid figcaption {
    grid-column: 1 / -1;
  }

  .story-figure--wide figcaption,
  .story-figure--pair figcaption,
  .story-figure--grid figcaption {
    padding-left: calc(50% + var(--col-gap) / 2);
  }

  .slideshow {
    --slideshow-slide-w: 720px;
    margin: var(--gap-block) 0 var(--space-56);
    width: 100vw;
    margin-left: calc(50% - 50vw);
    overflow: visible;
  }

  .slideshow-scroller {
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    cursor: grab;
    outline: none;
  }

  .slideshow-scroller::-webkit-scrollbar { display: none; }
  .slideshow-scroller.is-dragging { cursor: grabbing; }

  .slideshow-track {
    display: flex;
    gap: var(--gap-media);
    width: max-content;
    padding-inline: var(--pad);
  }

  .slideshow-set {
    display: flex;
    gap: var(--gap-media);
    flex: 0 0 auto;
  }

  .slideshow-slide {
    position: relative;
    flex: 0 0 var(--slideshow-slide-w);
    width: var(--slideshow-slide-w);
    margin: 0;
    overflow: hidden;
    border-radius: var(--radius);
    background: var(--card);
  }

  .slideshow-slide img {
    display: block;
    width: 100%;
    height: auto;
    pointer-events: none;
    user-select: none;
  }

  .contact {
    padding: var(--footer-pad-top) var(--pad) var(--footer-pad-bottom);
    background: var(--bg);
  }

  .contact-top {
    display: grid;
    grid-template-columns: var(--cols);
    gap: var(--col-gap);
    align-items: start;
  }

  .contact-headline {
    margin: 0;
    font-size: var(--ui-size);
    font-weight: 600;
    line-height: var(--ui-lead);
  }

  .contact-links {
    grid-column: 3;
    display: flex;
    flex-direction: column;
    gap: var(--gap-stack);
    font-weight: 600;
  }

  .contact-clock {
    justify-self: end;
    font-weight: 600;
    white-space: nowrap;
  }

  @media (max-width: 800px) {
    .story,
    .grid,
    .contact-top {
      grid-template-columns: 1fr;
      row-gap: var(--gap-media);
    }

    .story p,
    .story-figure,
    .story-figure--wide,
    .story-figure--pair,
    .story-figure--grid,
    .intro-menu h1,
    .intro-copy,
    .intro-meta,
    .contact-links {
      grid-column: 1;
      grid-row: auto;
    }

    .story-figure--pair,
    .story-figure--grid {
      grid-template-columns: 1fr;
    }

    .story-figure--wide figcaption,
    .story-figure--pair figcaption,
    .story-figure--grid figcaption {
      padding-left: 0;
    }

    .contact-clock {
      justify-self: start;
    }
  }
</style>
</head>
<body>

  <section class="hero" aria-label="Rante">
    <img src="rante.svg" alt="Rante" width="602" height="191">
  </section>

  <main class="project-page">
    <section class="intro" data-project aria-label="Project">
      <div class="grid intro-menu">
        <h1></h1>
        <ul class="intro-meta"></ul>
        <div class="intro-copy"></div>
      </div>
    </section>

    <article class="story" id="story" aria-label="Story"></article>

    <section
      class="slideshow"
      aria-label="Rante gallery"
      data-slideshow
      data-folder="slideshow/"
      data-manifest="slideshow/slides.json"
      data-slide-size="720"></section>
  </main>

  <script src="../../other/site.js?v=16"></script>
  <script src="../../other/project-md.js"></script>
  <script>
    ProjectMd.mount(document.querySelector("[data-project]"), "Project.md");
  </script>
  <script src="../../other/story-md.js?v=2"></script>
  <script>
    StoryMd.load(document.getElementById("story"), "history/story.md", "history/");
  </script>
  <script src="../../other/slideshow.js"></script>
  <script src="../../other/draw.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SASHA — Audit</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../other/tokens.css?v=live-17">
<style>
  * { box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    background: var(--bg);
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ui);
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  a:hover { color: var(--muted); }

  body > .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 40;
    padding: var(--header-pad-top) var(--pad) var(--header-pad-bottom);
    background: transparent !important;
    background-color: transparent !important;
    color: var(--ink);
  }

  .site-nav {
    display: grid;
    grid-template-columns: var(--cols) auto;
    gap: var(--col-gap);
    align-items: baseline;
    font-weight: 600;
  }

  .site-nav a { color: var(--ink); }
  .site-nav a:hover { color: var(--muted); }

  .brand {
    font-family: var(--ui);
    font-size: var(--ui-size);
    font-weight: 600;
    line-height: var(--ui-lead);
  }

  .hero {
    display: flex;
    align-items: flex-end;
    margin: 0;
    padding: 0 var(--pad) var(--gap-page);
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--bg);
  }

  .hero img {
    display: block;
    width: 100%;
    height: auto;
  }

  .project-page {
    padding: 0 var(--pad) var(--gap-page);
  }

  .grid {
    display: grid;
    grid-template-columns: var(--cols);
    gap: var(--col-gap);
    align-items: start;
  }

  .grid p,
  .grid h1 {
    margin: 0;
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
  }

  .intro {
    margin: 0 0 var(--gap-page);
  }

  .intro-menu {
    align-items: baseline;
  }

  .intro-menu h1 {
    font-family: var(--ui);
    font-size: var(--text-xl);
    line-height: var(--lead-tight);
    font-weight: 600;
    letter-spacing: -0.03em;
  }

  .intro-meta {
    grid-column: 2 / -1;
    justify-self: end;
    margin: 0;
    padding: 0;
    list-style: none;
    text-align: right;
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
  }

  .intro-meta li {
    display: inline;
    white-space: nowrap;
  }

  .intro-meta li + li::before {
    content: "";
    display: inline-block;
    width: 1.75em;
  }

  .intro-meta .label {
    margin-right: 0.55em;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .intro-copy {
    margin-top: var(--gap-block);
  }

  .intro-copy p {
    grid-column: 1 / -1;
    max-width: none;
    font-size: var(--text-lg);
    line-height: var(--lead-copy);
    font-weight: 600;
  }

  .intro-copy p + p {
    margin-top: var(--gap-text);
  }

  .gallery {
    display: flex;
    flex-direction: column;
    gap: var(--col-gap);
    margin: 0;
  }

  .gallery-pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--col-gap);
    margin: 0;
  }

  .gallery figure {
    margin: 0;
    overflow: hidden;
    border-radius: var(--radius);
  }

  .gallery img {
    display: block;
    width: 100%;
    height: auto;
  }

  .contact {
    padding: var(--footer-pad-top) var(--pad) var(--footer-pad-bottom);
    background: var(--bg);
  }

  .contact-top {
    display: grid;
    grid-template-columns: var(--cols);
    gap: var(--col-gap);
    align-items: start;
  }

  .contact-headline {
    margin: 0;
    font-size: var(--ui-size);
    font-weight: 600;
    line-height: var(--ui-lead);
  }

  .contact-links {
    grid-column: 3;
    display: flex;
    flex-direction: column;
    gap: var(--gap-stack);
    font-weight: 600;
  }

  .contact-clock {
    justify-self: end;
    font-weight: 600;
    white-space: nowrap;
  }

  @media (max-width: 800px) {
    .grid,
    .contact-top {
      grid-template-columns: 1fr;
      row-gap: var(--gap-media);
    }

    .intro-copy p,
    .intro-meta,
    .contact-links {
      grid-column: 1;
    }

    .gallery-pair {
      grid-template-columns: 1fr;
    }

    .contact-clock {
      justify-self: start;
    }
  }
</style>
</head>
<body>

  <section class="hero" aria-label="Audit">
    <img src="audit.svg?v=6504x1824" alt="Audit" width="6504" height="1824">
  </section>

  <main class="project-page">
    <section class="intro" data-project aria-label="Project">
      <div class="grid intro-menu">
        <h1></h1>
        <ul class="intro-meta"></ul>
      </div>
      <div class="grid intro-copy"></div>
    </section>

    <section class="gallery" aria-label="Audit applications">
      <div class="gallery-pair">
        <figure>
          <img src="audit-clothes-1.jpg" alt="Yandex Audit logo embroidered on a black sweatshirt" width="1620" height="2025">
        </figure>
        <figure>
          <img src="audit-clothes-2.jpg" alt="Yandex Audit logo on an oversized black sweatshirt" width="1620" height="2025">
        </figure>
      </div>
      <figure>
        <img src="audit-glasses.jpg" alt="Yandex Audit logo printed on the temple of black sunglasses" width="1748" height="1371">
      </figure>
    </section>
  </main>

  <script src="../../other/site.js?v=16"></script>
  <script src="../../other/project-md.js?v=2"></script>
  <script>
    ProjectMd.mount(document.querySelector("[data-project]"), "Project.md");
  </script>
  <script src="../../other/draw.js?v=2"></script>
</body>
</html>

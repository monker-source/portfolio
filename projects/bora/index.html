<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SASHA — Bora</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../../other/tokens.css?v=live-23">
<style>
  * { box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    background: var(--bg);
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ui);
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  a:hover { color: var(--muted); }

  body > .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 40;
    padding: var(--header-pad-top) var(--pad) var(--header-pad-bottom);
    background: transparent !important;
    background-color: transparent !important;
    color: var(--ink);
  }

  .site-nav {
    display: grid;
    grid-template-columns: var(--cols) auto;
    gap: var(--col-gap);
    align-items: baseline;
    font-weight: 600;
  }

  .site-nav a { color: var(--ink); }
  .site-nav a:hover { color: var(--muted); }

  .brand {
    font-family: var(--ui);
    font-size: var(--ui-size);
    font-weight: 600;
    line-height: var(--ui-lead);
  }

  .project-page {
    padding: var(--gap-section) var(--pad) var(--gap-page);
  }

  .grid {
    display: grid;
    grid-template-columns: var(--cols);
    gap: var(--col-gap);
    align-items: start;
  }

  .grid p,
  .grid h1 {
    margin: 0;
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
  }

  .intro {
    margin: 0 0 var(--gap-page);
  }

  .intro-menu {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    width: 100%;
  }

  .intro-menu h1 {
    font-family: var(--ui);
    font-size: var(--text-lg);
    line-height: var(--lead-copy);
    font-weight: 600;
    letter-spacing: normal;
  }

  .intro-meta {
    display: contents;
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: var(--text-lg);
    line-height: var(--lead-copy);
    font-weight: 600;
  }

  .intro-meta li {
    white-space: nowrap;
    font-size: var(--text-lg);
    line-height: var(--lead-copy);
    font-weight: 600;
  }

  .intro-meta .label {
    margin-right: 0.55em;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: normal;
  }

  .intro-copy {
    margin-top: var(--gap-block);
  }

  .intro-copy p {
    grid-column: 1 / -1;
    max-width: none;
    font-size: var(--text-lg);
    line-height: var(--lead-copy);
    font-weight: 600;
  }

  .intro-more {
    margin-top: var(--space-20);
  }

  .intro-more a {
    font-size: var(--text-md);
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .intro-more[hidden],
  .slideshow[hidden] {
    display: none;
  }

  .slideshow {
    --slideshow-slide-w: 720px;
    margin: var(--gap-block) 0 var(--space-56);
    width: 100vw;
    margin-left: calc(50% - 50vw);
    overflow: visible;
  }

  .slideshow-scroller {
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    cursor: grab;
    outline: none;
  }

  .slideshow-scroller::-webkit-scrollbar { display: none; }
  .slideshow-scroller.is-dragging { cursor: grabbing; }

  .slideshow-track {
    display: flex;
    gap: var(--gap-media);
    width: max-content;
    padding-inline: var(--pad);
  }

  .slideshow-set {
    display: flex;
    gap: var(--gap-media);
    flex: 0 0 auto;
  }

  .slideshow-slide {
    position: relative;
    flex: 0 0 var(--slideshow-slide-w);
    width: var(--slideshow-slide-w);
    margin: 0;
    overflow: hidden;
    border-radius: var(--radius);
    background: var(--card);
  }

  .slideshow-slide img {
    display: block;
    width: 100%;
    height: auto;
    pointer-events: none;
    user-select: none;
  }

  .contact {
    padding: var(--footer-pad-top) var(--pad) var(--footer-pad-bottom);
    background: var(--bg);
  }

  .contact-top {
    display: grid;
    grid-template-columns: var(--cols);
    gap: var(--col-gap);
    align-items: start;
  }

  .contact-headline {
    margin: 0;
    font-size: var(--ui-size);
    font-weight: 600;
    line-height: var(--ui-lead);
  }

  .contact-links {
    grid-column: 3;
    display: flex;
    flex-direction: column;
    gap: var(--gap-stack);
    font-weight: 600;
  }

  .contact-clock {
    justify-self: end;
    font-weight: 600;
    white-space: nowrap;
  }

  @media (max-width: 800px) {
    .intro-menu {
      flex-direction: column;
      align-items: flex-start;
      row-gap: var(--gap-stack);
    }

    .intro-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      column-gap: 1.75em;
      row-gap: var(--gap-stack);
      width: 100%;
    }

    .grid,
    .contact-top {
      grid-template-columns: 1fr;
      row-gap: var(--gap-media);
    }

    .intro-copy p,
    .intro-more,
    .intro-meta,
    .contact-links {
      grid-column: 1;
    }

    .contact-clock {
      justify-self: start;
    }
  }
</style>
</head>
<body>

  <main class="project-page">
    <section class="intro" data-project aria-label="Project">
      <div class="grid intro-menu">
        <h1></h1>
        <ul class="intro-meta"></ul>
      </div>
      <div class="grid intro-copy"></div>
      <div class="grid intro-more" hidden>
        <a href="history/">How it was done</a>
      </div>
    </section>

    <section
      class="slideshow"
      aria-label="Bora gallery"
      data-slideshow
      data-folder="slideshow/"
      data-manifest="slideshow/slides.json"
      data-slide-size="720"></section>
  </main>

  <script src="../../other/site.js?v=19"></script>
  <script src="../../other/project-md.js?v=6"></script>
  <script>
    ProjectMd.mount(document.querySelector("[data-project]"), "Project.md");
  </script>
  <script src="../../other/slideshow.js"></script>
  <script src="../../other/draw.js"></script>
</body>
</html>

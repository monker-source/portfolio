<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SASHA — Bora</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens.css">
<style>
  * { box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    background: var(--bg);
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ui);
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  a:hover { color: var(--muted); }

  body > .site-header {
    position: sticky;
    top: 0;
    left: 0;
    right: 0;
    z-index: 40;
    padding: 18px var(--pad) 14px;
    background: var(--bg);
    color: var(--ink);
  }

  .site-nav {
    display: grid;
    grid-template-columns: var(--cols) auto;
    gap: var(--col-gap);
    align-items: baseline;
    font-weight: 600;
  }

  .site-nav a { color: var(--ink); }
  .site-nav a:hover { color: var(--muted); }

  .brand {
    font-family: var(--ui);
    font-size: var(--ui-size);
    font-weight: 600;
    line-height: var(--ui-lead);
  }

  .project-page {
    padding: var(--gap-section) var(--pad) var(--gap-page);
  }

  .grid {
    display: grid;
    grid-template-columns: var(--cols);
    gap: var(--col-gap);
    align-items: start;
  }

  .grid p,
  .grid h1 {
    margin: 0;
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
  }

  .intro {
    margin: 0 0 var(--space-40);
  }

  .intro-menu {
    align-items: start;
  }

  .intro-menu h1 {
    font-family: var(--ui);
    font-size: var(--text-xl);
    line-height: var(--lead-tight);
    font-weight: 600;
    letter-spacing: -0.03em;
  }

  .intro-meta {
    grid-column: 4;
    display: grid;
    grid-template-columns: max-content 1fr;
    column-gap: 1.25em;
    row-gap: 0;
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
  }

  .intro-meta li {
    display: contents;
  }

  .intro-meta .label {
    color: var(--muted);
  }

  .intro-copy {
    margin-top: var(--gap-block);
  }

  .intro-copy p {
    grid-column: 1 / 3;
    max-width: 36em;
    font-size: var(--text-lg);
    line-height: 1.3;
    font-weight: 600;
  }

  .intro-more {
    margin-top: var(--space-20);
  }

  .intro-more a {
    font-size: var(--text-md);
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .intro-more[hidden],
  .slideshow[hidden] {
    display: none;
  }

  .slideshow {
    --slideshow-slide-w: 720px;
    margin: var(--gap-block) 0 var(--space-56);
    width: 100vw;
    margin-left: calc(50% - 50vw);
    overflow: visible;
  }

  .slideshow-scroller {
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    cursor: grab;
    outline: none;
  }

  .slideshow-scroller::-webkit-scrollbar { display: none; }
  .slideshow-scroller.is-dragging { cursor: grabbing; }

  .slideshow-track {
    display: flex;
    gap: var(--gap-media);
    width: max-content;
    padding-inline: var(--pad);
  }

  .slideshow-set {
    display: flex;
    gap: var(--gap-media);
    flex: 0 0 auto;
  }

  .slideshow-slide {
    position: relative;
    flex: 0 0 var(--slideshow-slide-w);
    width: var(--slideshow-slide-w);
    margin: 0;
    overflow: hidden;
    border-radius: 8px;
    background: var(--card);
  }

  .slideshow-slide img {
    display: block;
    width: 100%;
    height: auto;
    pointer-events: none;
    user-select: none;
  }

  .contact {
    padding: 14px var(--pad) 18px;
    background: var(--bg);
  }

  .contact-top {
    display: grid;
    grid-template-columns: var(--cols);
    gap: var(--col-gap);
    align-items: start;
  }

  .contact-headline {
    margin: 0;
    font-size: var(--ui-size);
    font-weight: 600;
    line-height: var(--ui-lead);
  }

  .contact-links {
    grid-column: 3;
    display: flex;
    flex-direction: column;
    gap: var(--gap-stack);
    font-weight: 600;
  }

  .contact-clock {
    justify-self: end;
    font-weight: 600;
    white-space: nowrap;
  }

  @media (max-width: 800px) {
    .grid,
    .contact-top {
      grid-template-columns: 1fr;
      row-gap: var(--gap-media);
    }

    .intro-copy p,
    .intro-more,
    .intro-meta,
    .contact-links {
      grid-column: 1;
    }

    .contact-clock {
      justify-self: start;
    }
  }
</style>
</head>
<body>

  <main class="project-page">
    <section class="intro" aria-label="Project">
      <div class="grid intro-menu">
        <h1>Bora</h1>
        <ul class="intro-meta">
          <li><span class="label">Year</span><span>2026</span></li>
          <li><span class="label">Client</span><span>Bora</span></li>
          <li><span class="label">Art&#8209;director</span><span>Rante Blagaya</span></li>
          <li><span class="label">Deliverables</span><span>Logo, identity</span></li>
        </ul>
      </div>
      <div class="grid intro-copy">
        <p>
          Placeholder description for Bora — a short note about the project goes here.
        </p>
      </div>
      <div class="grid intro-more" hidden>
        <a href="history/">How it was done</a>
      </div>
    </section>

    <section
      class="slideshow"
      aria-label="Bora gallery"
      data-slideshow
      data-folder="slideshow/"
      data-manifest="slideshow/slides.json"
      data-slide-size="720"></section>
  </main>

  <script src="../../site.js"></script>
  <script src="../../slideshow.js"></script>
  <script src="../../draw.js"></script>
</body>
</html>

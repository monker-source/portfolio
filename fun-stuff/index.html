<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SASHA — Fun</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../other/tokens.css?v=size-half-11">
<style>
  @font-face {
    font-family: "Imperial";
    src: url("../fonts/imperialBetaV01-Regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ui);
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  a:hover { color: var(--muted); }

  .is-active { color: inherit; }

  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 40;
    padding: var(--header-pad-top) var(--pad) var(--header-pad-bottom);
    background: transparent !important;
    background-color: transparent !important;
    color: var(--ink);
  }

  .site-nav {
    display: grid;
    grid-template-columns: var(--cols) auto;
    gap: var(--col-gap);
    align-items: baseline;
    font-weight: 600;
  }

  .site-nav > a {
    color: var(--ink);
  }

  .site-nav > a:hover {
    color: var(--muted);
  }

  .brand {
    font-family: var(--ui);
    font-size: var(--ui-size);
    font-weight: 600;
    line-height: var(--ui-lead);
  }

  .works {
    padding: var(--gap-section) var(--pad) var(--gap-page);
    overflow: hidden;
  }

  .projects {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 0;
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    min-height: 40vh;
  }

  .project {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: var(--gap-media);
    z-index: 1;
  }

  .project:hover {
    z-index: 5;
  }

  .project-media {
    display: block;
    line-height: 0;
    width: 100%;
  }

  .project-media img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: var(--radius);
  }

  .project-fallback {
    margin: 0;
    padding: var(--gap-card);
    font-size: var(--text-lg);
    font-weight: 600;
    color: var(--ink);
  }

  .project[data-place="0"] {
    width: min(72%, 820px);
    align-self: flex-start;
    margin-left: 2%;
    margin-bottom: -4vh;
  }

  .project[data-place="1"] {
    width: min(58%, 680px);
    align-self: flex-end;
    margin-right: 3%;
    margin-top: 8vh;
    margin-bottom: -6vh;
  }

  .project[data-place="2"] {
    width: min(68%, 760px);
    align-self: center;
    margin-left: -6%;
    margin-top: 10vh;
    margin-bottom: -3vh;
  }

  .project[data-place="3"] {
    width: min(62%, 720px);
    align-self: flex-start;
    margin-left: 12%;
    margin-top: 6vh;
    margin-bottom: -5vh;
  }

  .contact {
    padding: var(--footer-pad-top) var(--pad) var(--footer-pad-bottom);
    background: var(--bg);
  }

  .contact-top {
    display: grid;
    grid-template-columns: var(--cols);
    gap: var(--col-gap);
    align-items: start;
  }

  .contact-headline {
    margin: 0;
    font-size: var(--ui-size);
    font-weight: 600;
    line-height: var(--ui-lead);
  }

  .contact-links {
    grid-column: 3;
    display: flex;
    flex-direction: column;
    gap: var(--gap-stack);
    font-weight: 600;
  }

  .contact-clock {
    justify-self: end;
    font-weight: 600;
    white-space: nowrap;
  }

  @media (max-width: 800px) {
    .contact-top {
      grid-template-columns: 1fr;
      row-gap: var(--gap-media);
    }

    .contact-links {
      grid-column: 1;
    }

    .contact-clock {
      justify-self: start;
    }

    .project[data-place] {
      width: min(96%, 720px);
      align-self: center;
      margin: 0 0 var(--gap-section);
    }
  }
</style>
</head>
<body>

  <section class="works" aria-label="Fun">
    <div class="projects" id="fun-stuff-list"></div>
  </section>

  <script src="../other/site.js?v=12"></script>
  <script src="fun.js?v=1"></script>
  <script src="../other/draw.js"></script>
</body>
</html>

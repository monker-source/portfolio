<!DOCTYPE html>
<html lang="en" data-theme="colour">
<head>
<meta charset="UTF-8">
<title>Card test</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="other/tokens.css?v=live-24">
<style>
  /* Temporary comparison. Colour theme is locked here so the three plates can be judged on blue. */
  html {
    --bg: var(--theme-colour-bg) !important;
    --ink: var(--theme-colour-ink) !important;
    --muted: var(--theme-colour-muted) !important;
    scroll-behavior: smooth;
    background: var(--bg);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ui);
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .theme-swatches { display: none !important; }

  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 40;
    padding: var(--header-pad-top) var(--pad) var(--header-pad-bottom);
    background: transparent !important;
    color: var(--ink);
  }

  body[data-nav-reveal] .site-header {
    opacity: 0;
    pointer-events: none;
    transform: translateY(-6px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  body[data-nav-reveal] .site-header.is-visible {
    opacity: 1;
    pointer-events: auto;
    transform: none;
  }

  .trial {
    padding: var(--gap-section) var(--pad) calc(var(--gap-page) + 10vh);
  }

  .trial:first-of-type {
    padding-top: var(--pad);
  }

  .trial-label {
    margin: 0 0 var(--space-64);
    color: var(--ink);
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
  }

  .projects {
    display: flex;
    flex-direction: column;
    gap: 0;
    width: 100%;
    margin: 0 auto;
  }

  .project {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: var(--gap-card);
    z-index: 1;
    padding: calc(var(--ui-size) * 2);
    background: var(--card);
    color: var(--card-ink);
    border-radius: var(--radius);
    container-type: inline-size;
  }

  .project-media {
    display: block;
    line-height: 0;
    width: 100%;
    aspect-ratio: var(--ratio, auto);
  }

  .project-media img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .project-media:has(.project-fallback) {
    line-height: normal;
  }

  .project-fallback {
    margin: 0;
    width: max-content;
    font-family: var(--display);
    color: inherit;
    font-size: 18cqw;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 0.9;
    white-space: nowrap;
  }

  .project-meta {
    display: grid;
    grid-template-columns: minmax(0, var(--desc-max)) 1fr max-content;
    column-gap: var(--col-gap);
    align-items: start;
    justify-content: space-between;
  }

  .project-title { display: none; }

  .project-description {
    grid-column: 1;
    grid-row: 1;
    margin: 0;
    max-width: var(--desc-max);
    color: inherit;
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
  }

  .project-kind {
    grid-column: 3;
    grid-row: 1;
    margin: 0;
    justify-self: end;
    color: var(--card-muted);
    font-size: var(--ui-size);
    line-height: var(--ui-lead);
    font-weight: 600;
    white-space: nowrap;
  }

  :root { --desc-max: 640px; }

  .project[data-place="0"] {
    width: min(64%, 780px);
    align-self: flex-start;
    margin-bottom: -4vh;
  }

  .project[data-place="1"] {
    width: min(50%, 600px);
    align-self: flex-end;
    margin-top: 8vh;
    margin-bottom: -6vh;
  }

  .project[data-place="2"] {
    width: min(58%, 700px);
    align-self: flex-start;
    margin-left: 8%;
    margin-top: 10vh;
    margin-bottom: -3vh;
  }

  .project[data-place="3"] {
    width: min(54%, 640px);
    align-self: flex-end;
    margin-right: 6%;
    margin-top: 6vh;
    margin-bottom: -5vh;
  }

  .project[data-place="4"] {
    width: min(52%, 620px);
    align-self: flex-start;
    margin-left: 4%;
    margin-top: 8vh;
    margin-bottom: -4vh;
  }

  .project[data-place="5"] {
    width: min(62%, 740px);
    align-self: flex-end;
    margin-top: 10vh;
  }

  /* A — yellow plate, blue type */
  .trial-a .project {
    background: var(--ink);
    color: var(--bg);
  }

  .trial-a .project-kind {
    color: color-mix(in srgb, var(--bg) 70%, transparent);
  }

  /* B — no plate, yellow type on the page */
  .trial-b .project {
    background: transparent;
    color: var(--ink);
  }

  .trial-b .project-kind {
    color: var(--muted);
  }

  /* C — blue plate, yellow edge, yellow type */
  .trial-c .project {
    background: var(--bg);
    color: var(--ink);
    outline: 1px solid var(--ink);
  }

  .trial-c .project-kind {
    color: color-mix(in srgb, var(--ink) 70%, transparent);
  }

  @media (max-width: 800px) {
    .project[data-place] {
      width: 100%;
      align-self: stretch;
      margin: 0 0 var(--gap-section);
    }

    .project-meta {
      grid-template-columns: 1fr;
    }

    .project-description,
    .project-kind {
      grid-column: 1;
      grid-row: auto;
    }
  }
</style>
</head>
<body data-nav-reveal data-footer="false">

  <section class="trial trial-a" aria-label="A, yellow plate">
    <p class="trial-label">A — Yellow plate</p>
    <div class="projects"></div>
  </section>

  <section class="trial trial-b" aria-label="B, no plate">
    <p class="trial-label">B — No plate</p>
    <div class="projects"></div>
  </section>

  <section class="trial trial-c" aria-label="C, blue plate">
    <p class="trial-label">C — Blue plate, yellow edge</p>
    <div class="projects"></div>
  </section>

  <script src="other/site.js?v=19"></script>
  <script>
    (function () {
      function renderProject(project, index) {
        const el = document.createElement("article");
        el.className = "project";
        el.dataset.place = String(index % 6);

        const media = document.createElement("div");
        media.className = "project-media";

        if (project.width && project.height) {
          media.style.setProperty("--ratio", project.width + " / " + project.height);
        }

        if (project.preview) {
          const img = document.createElement("img");
          img.src = project.preview + "?v=" + (project.width || 0) + "x" + (project.height || 0);
          img.alt = project.title;
          img.loading = "lazy";
          if (project.width && project.height) {
            img.width = project.width;
            img.height = project.height;
          }
          media.appendChild(img);
        } else {
          const fallback = document.createElement("p");
          fallback.className = "project-fallback";
          fallback.textContent = project.title;
          media.appendChild(fallback);
        }

        const meta = document.createElement("div");
        meta.className = "project-meta";

        const description = document.createElement("p");
        description.className = "project-description";
        description.textContent = project.description || "";

        const kind = document.createElement("p");
        kind.className = "project-kind";
        kind.textContent = project.kind || "";

        meta.appendChild(description);
        meta.appendChild(kind);
        el.appendChild(media);
        el.appendChild(meta);
        return el;
      }

      function fitFallbacks() {
        document.querySelectorAll(".project-fallback").forEach(function (el) {
          const parent = el.parentElement;
          const parentW = parent.clientWidth;
          if (!parentW) return;
          el.style.width = "max-content";
          el.style.fontSize = "100px";
          const textW = el.getBoundingClientRect().width;
          if (!textW) return;
          el.style.fontSize = (100 * parentW) / textW + "px";
        });
      }

      window.loadProjects().then(function (projects) {
        document.querySelectorAll(".projects").forEach(function (list) {
          projects.forEach(function (project, index) {
            list.appendChild(renderProject(project, index));
          });
        });

        function scheduleFit() {
          requestAnimationFrame(function () {
            fitFallbacks();
            requestAnimationFrame(fitFallbacks);
          });
        }

        scheduleFit();
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(scheduleFit);
        }
        window.addEventListener("resize", scheduleFit);
      });
    })();
  </script>
</body>
</html>
